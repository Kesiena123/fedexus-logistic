services:
  - type: web
    name: fedexus-logistic
    runtime: docker
    repo: https://github.com/Kesiena123/fedexus-logistic.git
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://fedexus-logistic.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: mysql-2043b851-biagodstimei-80c3.f.aivencloud.com
      - key: DB_PORT
        value: "26301"
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: storage/certs/aiven-ca.pem
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
      - key: BROADCAST_CONNECTION
        value: log
